slam_toolbox:
  ros__parameters:

    # Simulation
    use_sim_time: true

    # Coordinate frames
    odom_frame: odom
    map_frame: map
    base_frame: chassis

    # LiDAR
    scan_topic: /scan

    # SLAM mode
    mode: mapping

    # Map settings
    resolution: 0.05
    map_update_interval: 2.0

    # Scan processing
    throttle_scans: 1
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1

    # LiDAR range
    max_laser_range: 12.0

    # Transform settings
    transform_publish_period: 0.02
    transform_timeout: 0.2

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true

    # Optimization
    solver_plugin: solver_plugins::CeresSolver
